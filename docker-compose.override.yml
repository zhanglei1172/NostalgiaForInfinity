services:
  freqtrade:
    image: nfi-paper:local
    container_name: NFI_Paper_okx_spot-NostalgiaForInfinityX8
    dns:
      - ${NFI_DNS_SERVER:-1.1.1.1}
    environment:
      NFI_RESEARCH_URL: http://backtesting:8080
      NFI_RECIPE_ROLE: paper
      NFI_RECIPE_DIR: /freqtrade/user_data/recipes-okx
      FREQTRADE__EXCHANGE__NAME: okx
      FREQTRADE__EXCHANGE__KEY: ""
      FREQTRADE__EXCHANGE__SECRET: ""
      FREQTRADE__EXCHANGE__PASSWORD: ""
      FREQTRADE__TRADING_MODE: spot
      FREQTRADE__BOT_NAME: NFI_Paper_OKX
      # Safe fallback; the Worker applies the Web startup preference after config parsing.
      FREQTRADE__INITIAL_STATE: stopped
    depends_on:
      - backtesting
    ports: !override
      - "127.0.0.1:18080:8080"
    command: >
      trade
      --config user_data/config.json
      --config configs/paper-okx.json
      --strategy-path .
      --dry-run
      --db-url sqlite:////freqtrade/user_data/nfi-paper-okx.sqlite
      --log-file user_data/logs/nfi-paper-okx.log
  backtesting:
    image: nfi-paper:local
    dns:
      - ${NFI_DNS_SERVER:-1.1.1.1}
    build:
      context: .
      dockerfile: docker/Dockerfile.custom
    restart: unless-stopped
    cpus: 2
    mem_limit: 6g
    networks:
      - default
      - research
    volumes:
      - ./user_data/research-okx:/freqtrade/user_data
      - ./configs/research.json:/freqtrade/configs/research.json:ro
      - ./configs/blacklist-okx.json:/freqtrade/configs/blacklist-okx.json:ro
      - ./user_data/recipes-okx:/freqtrade/recipes:ro
      - ./NostalgiaForInfinityX8.py:/freqtrade/strategies/NostalgiaForInfinityX8.py:ro
      - ./NostalgiaForInfinityX7.py:/freqtrade/strategies/NostalgiaForInfinityX7.py:ro
      - ./NostalgiaForInfinityX6.py:/freqtrade/strategies/NostalgiaForInfinityX6.py:ro
    environment:
      NFI_RECIPE_DIR: /freqtrade/recipes
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME:-paper}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD:-}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE__API_SERVER__JWT_SECRET_KEY:-}
    command: >
      webserver
      --config configs/research.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  research:
    name: ${NFI_RESEARCH_NETWORK:-nfi-research}
    internal: true
